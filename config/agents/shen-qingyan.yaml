  proactive: false

  skills:
    - file-operations
    - git-operations
    - csv-pipeline
    - plan-i
    - frontend-design

  llm:
    model_name: kimi-k2.5
    temperature: 1.0

  docker:
    image: ubuntu:22.04
    memory_limit: 512m
