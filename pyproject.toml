[project]
name = "tlon-impact"
version = "0.0.4-alpha.3"
description = "Self-evolving agents, towards AGI"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.11"
authors = [
    {name = "Rika"}
]
keywords = ["agent", "ai", "chatbot", "collaboration", "docker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "pydantic>=2.0.0",
    "jsonschema>=4.26.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "filelock>=3.25.2",
    # Docker
    "docker>=6.0.0",
    # Server
    "aiohttp>=3.9.0",
    # Logging
    "structlog>=23.0.0",
    "opentelemetry-sdk>=1.30",
    # LLM（litellm 次版本间有 breaking change，锁定次版本，ADR 0012）
    "litellm==1.105.*",
    "croniter>=6.2.4",
]

[project.optional-dependencies]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]
# Telegram bot 客户端（PR2 落地本体）；不用此功能不装
telegram = [
    "python-telegram-bot>=21",
]

[project.scripts]
tlon = "tlon_launcher.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlon", "src/tlosure", "src/tlon_server", "src/tlon_client", "src/tlon_launcher"]
# webui_dist 是构建期生成的包数据（scripts/build_package.sh 正式打包、
# scripts/verify_package.sh 质量门验证，均从 apps/webui/dist 同步），
# 被 .gitignore 排除；artifacts 把它拉回文件选择，不存在时不报错
artifacts = ["src/tlon_server/webui_dist/**"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "tlon/resources/docs"

[tool.hatch.build.targets.sdist]
only-include = ["src", "scripts", "docs", "README.md", "LICENSE", "pyproject.toml", "uv.lock", ".python-version"]
# 同 wheel：sdist 需携带 webui_dist，否则 uv build 的 wheel-from-sdist 拿不到
artifacts = ["src/tlon_server/webui_dist/**"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM",# flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by ruff format
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
# decorators 并非全部带类型（questionary/rich 等），strict 的默认
# disallow_untyped_decorators 会大面积误报，显式放宽
disallow_untyped_decorators = false
warn_unreachable = true
show_error_codes = true

# 测试代码：fake/stub 与 fixture 大量无注解且有意 mock 掉真实类型，
# 全量 strict 修不动也不值得修；只放宽定义级旗标，仍保留 body 检查
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# python-telegram-bot 是 optional extra：无 extra 环境下 telegram.* 解析
# 为 Any（clients/telegram/bot.py 仍能过 mypy）；装上 extra 后 PTB 自带
# py.typed，按真实类型全量检查
[[tool.mypy.overrides]]
module = "telegram.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["tlon", "tlosure", "tlon_server", "tlon_client", "tlon_launcher"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.4",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    # 三方类型 stub：全量 mypy 检查所需
    "types-PyYAML>=6.0.12",
    "types-jsonschema>=4.26.0",
    "types-aiofiles>=25.1.0",
    "types-docker>=7.2.0",
    # otlp 可选导出器装进 dev，让 mypy 能静态解析 otel.py 的延迟导入
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    # 依赖方向契约检查（lint-imports）
    "import-linter>=2.5",
    "types-croniter>=6.2.4.20260711",
]

[tool.importlinter]
root_packages = ["tlon", "tlosure", "tlon_server", "tlon_client", "tlon_launcher"]

# base 是最底层：不依赖任何上层域
[[tool.importlinter.contracts]]
name = "base 不依赖任何上层域"
type = "forbidden"
source_modules = "tlon.base"
forbidden_modules = [
    "tlon.agents",
    "tlon.organization",
    "tlon_server",
    "tlon_client",
    "tlon_launcher",
    "tlon.tools",
    "tlon.sandbox",
    "tlon.prototypes",
]

# organization(mail/messaging) 只依赖 base
[[tool.importlinter.contracts]]
name = "organization 不依赖 agents/server/client/launcher/tools/sandbox/prototypes"
type = "forbidden"
source_modules = "tlon.organization"
forbidden_modules = [
    "tlon.agents",
    "tlon_server",
    "tlon_client",
    "tlon_launcher",
    "tlon.tools",
    "tlon.sandbox",
    "tlon.prototypes",
]

# sandbox 只依赖 base
[[tool.importlinter.contracts]]
name = "sandbox 不依赖 agents/organization/server/client/launcher/tools/prototypes"
type = "forbidden"
source_modules = "tlon.sandbox"
forbidden_modules = [
    "tlon.agents",
    "tlon.organization",
    "tlon_server",
    "tlon_client",
    "tlon_launcher",
    "tlon.tools",
    "tlon.prototypes",
]

# tools 仅保留模型协议与结果/溢出适配；领域操作由 operations 定义，
# 领域端口位于 lifecycle/evolution 等领域包，由装配层注入。
[[tool.importlinter.contracts]]
name = "tools 不依赖 agents/server/client/launcher/prototypes"
type = "forbidden"
source_modules = "tlon.tools"
forbidden_modules = [
    "tlon.agents",
    "tlon_server",
    "tlon_client",
    "tlon_launcher",
    "tlon.prototypes",
]

# agents 是领域层：可依赖 base/memory/organization/tools/sandbox，
# 不得依赖组装层 server/client/launcher 与 prototypes
[[tool.importlinter.contracts]]
name = "agents 不依赖 server/client/launcher/prototypes"
type = "forbidden"
source_modules = "tlon.agents"
forbidden_modules = [
    "tlon_server",
    "tlon_client",
    "tlon_launcher",
    "tlon.prototypes",
]

# SDK 是给外部客户端用的纯协议层：不依赖 tlon 包（含 tlon.base），
# 日志直接用 structlog。这是 tlon_client 轻量分发的前提（）
[[tool.importlinter.contracts]]
name = "client.sdk 不依赖 tlon"
type = "forbidden"
source_modules = "tlon_client.sdk"
forbidden_modules = [
    "tlon",
    "tlon_server",
    "tlon_launcher",
]

# Telegram bot 客户端：与 sdk 同层的纯客户端包，只依赖 sdk / 第三方库
#（python-telegram-bot）；forbidden 清单镜像上面的 sdk 契约
[[tool.importlinter.contracts]]
name = "client.telegram 只依赖 sdk/第三方"
type = "forbidden"
source_modules = "tlon_client.telegram"
forbidden_modules = [
    "tlon",
    "tlon_server",
    "tlon_launcher",
]

# tlon_server（ADR 0019）：runtime 触点是 tlon.api 的 domain facades；
# 直摸 runtime 内脏被禁止（tlon.base 例外：events/settings/paths 等公共
# 地基）。只禁直接 import——facade 内部的间接传递正是收编的意义。
[[tool.importlinter.contracts]]
name = "server 只依赖 tlon.api + tlon.base"
type = "forbidden"
source_modules = "tlon_server"
forbidden_modules = [
    "tlon.agents",
    "tlon.organization",
    "tlon.sandbox",
    "tlon.tools",
    "tlon.prototypes",
]
allow_indirect_imports = true

# tlon_launcher 是 CLI 组装层：只许 tlon.base + tlon_server + tlon_client，
# 不直摸 runtime 内脏，也不经 tlon.api 绕行。只禁直接 import——经
# tlon_server/tlon_client 的间接传递是允许的（与 server 契约同纪律）
[[tool.importlinter.contracts]]
name = "launcher 不直摸 runtime"
type = "forbidden"
source_modules = "tlon_launcher"
forbidden_modules = [
    "tlon.agents",
    "tlon.organization",
    "tlon.sandbox",
    "tlon.tools",
    "tlon.prototypes",
    "tlon.api",
]
allow_indirect_imports = true

# tlon.api 是 runtime 的北向 API（ADR 0019）：可依赖 runtime 各层，
# 不得反向依赖组装层 server/client/launcher
[[tool.importlinter.contracts]]
name = "api 不依赖 server/client/launcher"
type = "forbidden"
source_modules = "tlon.api"
forbidden_modules = ["tlon_server", "tlon_client", "tlon_launcher"]

# tlosure（DSL 语言核心，ADR 0018）：独立于 tlon，反向依赖禁止
[[tool.importlinter.contracts]]
name = "tlosure 独立于 tlon"
type = "forbidden"
source_modules = "tlosure"
forbidden_modules = ["tlon"]

# Shared operation contracts receive domain ports; never import the caller.
[[tool.importlinter.contracts]]
name = "operations 不依赖 agents/server/client/launcher"
type = "forbidden"
source_modules = "tlon.operations"
forbidden_modules = ["tlon.agents", "tlon_server", "tlon_client", "tlon_launcher"]
