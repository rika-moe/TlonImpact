[project]
name = "tlon"
version = "0.1.0"
description = "A multi-agent collaboration system simulating a software engineering team"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Developer", email = "dev@example.com"}
]
keywords = ["agent", "ai", "chatbot", "collaboration", "docker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "jinja2>=3.1.0", # Template rendering for prompts
    # LLM
    "openai>=1.0.0",
    # Docker
    "docker>=6.0.0",
    # Server (Phase 5)
    "aiohttp>=3.9.0",
    # Telegram (for milestone 3)
    "python-telegram-bot>=20.0",
    # Logging
    "structlog>=23.0.0",
    "prompt-toolkit>=3.0.52",
    "rich>=14.3.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "questionary>=2.1.1",
]

[project.optional-dependencies]
wizard = [
    "rich>=13.0.0",
    "questionary>=2.0.0",
]
tui = [
    "textual>=0.45.0",
    "rich>=13.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "textual>=0.45.0",
]

[project.scripts]
tlon = "tlon.app.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlon"]
artifacts = ["src/tlon/webui/**/*"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "web", "scripts", "config", "skills", "docs", "tests", "README.md", "pyproject.toml", "uv.lock", ".python-version"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warnings
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM",# flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by black
]

[tool.ruff.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["tlon"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
