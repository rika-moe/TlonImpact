[project]
name = "tlon"
version = "0.1.0"
description = "A multi-agent collaboration system simulating a software engineering team"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Developer", email = "dev@example.com"}
]
keywords = ["agent", "ai", "chatbot", "collaboration", "docker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "jinja2>=3.1.0", # Template rendering for prompts
    # LLM
    "openai>=1.0.0",
    # Docker
    "docker>=6.0.0",
    # Server (Phase 5)
    "aiohttp>=3.9.0",
    # Telegram (for milestone 3)
    "python-telegram-bot>=20.0",
    # Logging
    "structlog>=23.0.0",
    "prompt-toolkit>=3.0.52",
    "rich>=14.3.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "questionary>=2.1.1",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "opentelemetry-sdk>=1.30",
]

[project.optional-dependencies]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.scripts]
tlon = "tlon.app.launcher.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlon"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "scripts", "config", "skills", "docs", "tests", "README.md", "pyproject.toml", "uv.lock", ".python-version"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM",# flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by ruff format
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["tlon"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.4",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]


# mypy  ratchet 基线（2026-08-07）：以下模块存在既有类型错误，暂时豁免；
# 清理一个就从列表移除一个。干净模块（尤其 agents/ 的契约与 stages/）
# 由 pre-commit 的 mypy 钩子强制保护。
[[tool.mypy.overrides]]
module = [
    "tlon.agents.agent_registry",
    "tlon.agents.agent",
    "tlon.agents.eval",
    "tlon.agents.reflection",
    "tlon.agents.script_spec",
    "tlon.agents.session",
    "tlon.agents.spec",
    "tlon.app.clients.sdk.adapter",
    "tlon.app.clients.sdk.base_client",
    "tlon.app.clients.sdk.client",
    "tlon.app.clients.sdk.exceptions",
    "tlon.app.server.serverapp",
    "tlon.app.server.api.rest",
    "tlon.app.server.api.websocket",
    "tlon.app.server.core.session_manager",
    "tlon.app.wizard.diagnostics",
    "tlon.app.wizard.validators",
    "tlon.app.wizard.wizard",
    "tlon.app.wizard.menus.agent_menu",
    "tlon.app.wizard.menus.diagnostics_menu",
    "tlon.app.wizard.menus.quickstart",
    "tlon.app.wizard.menus.settings_menu",
    "tlon.base.component",
    "tlon.base.config",
    "tlon.base.device",
    "tlon.base.llm_client",
    "tlon.base.logger",
    "tlon.base.settings",
    "tlon.base.events.event_bus",
    "tlon.base.tracing.jsonl_exporter",
    "tlon.base.tracing.otel",
    "tlon.base.tracing.trace_store",
    "tlon.memory.episodic_store",
    "tlon.memory.manager",
    "tlon.memory.summarizer",
    "tlon.memory.working_store",
    "tlon.organization.mail.mailbox",
    "tlon.sandbox.docker_runtime",
    "tlon.tools.base",
    "tlon.tools.agents.list_agents",
    "tlon.tools.agents.spawn_agent",
    "tlon.tools.agents.stop_agent",
    "tlon.tools.agents.write_prototype",
    "tlon.tools.filesystem.edit_file",
    "tlon.tools.filesystem.read_file",
    "tlon.tools.filesystem.write_file",
    "tlon.tools.mail.send_email",
    "tlon.tools.memory.compact",
    "tlon.tools.memory.forget_memory",
    "tlon.tools.memory.remember_fact",
    "tlon.tools.memory.search_memories",
    "tlon.tools.prototypes.list_prototypes",
    "tlon.tools.shell.execute_bash",
    "tlon.tools.tasks.complete_task",
    "tlon.tools.tasks.create_task",
    "tlon.tools.tasks.get_current_task",
    "tlon.tools.tasks.list_tasks",
    "tlon.tools.tasks.pause_task",
    "tlon.tools.tasks.remove_task",
    "tlon.tools.tasks.start_task",
]
ignore_errors = true
