[project]
name = "tlon"
version = "0.1.0"
description = "A multi-agent collaboration system simulating a software engineering team"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Developer", email = "dev@example.com"}
]
keywords = ["agent", "ai", "chatbot", "collaboration", "docker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "jinja2>=3.1.0", # Template rendering for prompts
    # LLM
    "openai>=1.0.0",
    # Docker
    "docker>=6.0.0",
    # Server (Phase 5)
    "aiohttp>=3.9.0",
    # Telegram (for milestone 3)
    "python-telegram-bot>=20.0",
    # Logging
    "structlog>=23.0.0",
    "prompt-toolkit>=3.0.52",
    "rich>=14.3.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "questionary>=2.1.1",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "opentelemetry-sdk>=1.30",
]

[project.optional-dependencies]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.scripts]
tlon = "tlon.app.launcher.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlon"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "scripts", "config", "skills", "docs", "tests", "README.md", "pyproject.toml", "uv.lock", ".python-version"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM",# flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by ruff format
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
# decorators 并非全部带类型（questionary/rich 等），strict 的默认
# disallow_untyped_decorators 会大面积误报，显式放宽
disallow_untyped_decorators = false
warn_unreachable = true
show_error_codes = true

# 测试代码：fake/stub 与 fixture 大量无注解且有意 mock 掉真实类型，
# 全量 strict 修不动也不值得修；只放宽定义级旗标，仍保留 body 检查
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["tlon"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.4",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    # 三方类型 stub：全量 mypy 检查所需
    "types-PyYAML>=6.0.12",
    "types-aiofiles>=25.1.0",
    "types-docker>=7.2.0",
    # otlp 可选导出器装进 dev，让 mypy 能静态解析 otel.py 的延迟导入
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    # 依赖方向契约检查（lint-imports）
    "import-linter>=2.5",
]

[tool.importlinter]
root_package = "tlon"

# base 是最底层：不依赖任何上层域
[[tool.importlinter.contracts]]
name = "base 不依赖任何上层域"
type = "forbidden"
source_modules = "tlon.base"
forbidden_modules = [
    "tlon.agents",
    "tlon.organization",
    "tlon.memory",
    "tlon.app",
    "tlon.tools",
    "tlon.sandbox",
    "tlon.prototypes",
]

# memory 只依赖 base
[[tool.importlinter.contracts]]
name = "memory 不依赖 agents/organization/app/tools/sandbox/prototypes"
type = "forbidden"
source_modules = "tlon.memory"
forbidden_modules = [
    "tlon.agents",
    "tlon.organization",
    "tlon.app",
    "tlon.tools",
    "tlon.sandbox",
    "tlon.prototypes",
]

# organization(mail/messaging) 只依赖 base
[[tool.importlinter.contracts]]
name = "organization 不依赖 agents/memory/app/tools/sandbox/prototypes"
type = "forbidden"
source_modules = "tlon.organization"
forbidden_modules = [
    "tlon.agents",
    "tlon.memory",
    "tlon.app",
    "tlon.tools",
    "tlon.sandbox",
    "tlon.prototypes",
]

# sandbox 只依赖 base
[[tool.importlinter.contracts]]
name = "sandbox 不依赖 agents/organization/memory/app/tools/prototypes"
type = "forbidden"
source_modules = "tlon.sandbox"
forbidden_modules = [
    "tlon.agents",
    "tlon.organization",
    "tlon.memory",
    "tlon.app",
    "tlon.tools",
    "tlon.prototypes",
]

# tools 依赖 base/sandbox（tools.memory.* 对 tlon.memory 仅 TYPE_CHECKING
# 类型引用，暂不放进去）；不得反向依赖 agents/app/prototypes。
#  已落地：生命周期/原型工具改为依赖倒置——端口与异常声明在
# tools/agents/ports.py 与 tools/prototypes/ports.py，装配层注入实现。
[[tool.importlinter.contracts]]
name = "tools 不依赖 agents/app/prototypes"
type = "forbidden"
source_modules = "tlon.tools"
forbidden_modules = [
    "tlon.agents",
    "tlon.app",
    "tlon.prototypes",
]

# agents 是领域层：可依赖 base/memory/organization/tools/sandbox，
# 不得依赖组装层 app 与 prototypes
[[tool.importlinter.contracts]]
name = "agents 不依赖 app/prototypes"
type = "forbidden"
source_modules = "tlon.agents"
forbidden_modules = [
    "tlon.app",
    "tlon.prototypes",
]

# SDK 是给外部客户端用的纯协议层：只依赖 tlon.base
[[tool.importlinter.contracts]]
name = "app.clients.sdk 只依赖 tlon.base"
type = "forbidden"
source_modules = "tlon.app.clients.sdk"
forbidden_modules = [
    "tlon.agents",
    "tlon.organization",
    "tlon.memory",
    "tlon.sandbox",
    "tlon.tools",
    "tlon.prototypes",
    "tlon.app.server",
    "tlon.app.wizard",
    "tlon.app.launcher",
]
