name: Static

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TS dependencies
        run: |
          npm ci --prefix apps/webui
          npm ci --prefix apps/operator

      - name: Static quality gate
        run: scripts/check_all.sh --static
