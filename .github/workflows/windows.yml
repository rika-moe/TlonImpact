name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  catalogs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --group dev
      - name: Catalog locks and prototype reviews
        shell: bash
        run: bash scripts/check_all.sh --windows-locks
