name: Windows

on:
  workflow_call:
  workflow_dispatch:

jobs:
  catalogs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --group dev
      - name: Catalog locks and prototype reviews
        shell: bash
        run: bash scripts/check_all.sh --windows-locks

  workspace:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Native workspace isolation and SDK smoke
        shell: bash
        run: bash scripts/check_all.sh --windows-workspace


  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/webui/package-lock.json
      - name: Build WebUI
        run: |
          npm --prefix apps/webui ci
          npm --prefix apps/webui run build
      - name: Build and exercise frozen Windows distribution
        shell: bash
        run: bash scripts/check_all.sh --windows-portable
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: Tlon-windows-x64
          path: dist/windows-portable/Tlon-windows-x64.zip
          if-no-files-found: error

  windows-smoke:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --group dev
      - run: bash scripts/check_all.sh --windows-smoke
