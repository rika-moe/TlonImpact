name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing 登记的 environment 名，两边必须一致
    environment: pypi
    permissions:
      id-token: write # OIDC：换取 PyPI 短期令牌，免存 API token

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # build_package.sh 要求 apps/webui/node_modules 存在（正式产物必含 WebUI）
      - name: Install TS dependencies
        run: npm ci --prefix apps/webui

      - name: Check tag version matches pyproject
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$tag" != "$pkg" ]; then
            echo "❌ tag ($tag) 与 pyproject 版本 ($pkg) 不一致" >&2
            exit 1
          fi
          echo "版本一致：$tag"

      - name: Build package
        run: bash scripts/build_package.sh

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
