name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing 登记的 environment 名，两边必须一致
    environment: pypi
    permissions:
      id-token: write # OIDC：换取 PyPI 短期令牌，免存 API token
      contents: write # actions/checkout 拉取 + gh release create 建 Release（显式 permissions 会把未列出的降为 none）

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # TS 门禁要求两端 node_modules（check_all.sh 的 ts_run 契约：CI 恒执行）
      - name: Install TS dependencies
        run: |
          npm ci --prefix apps/webui
          npm ci --prefix apps/operator

      # 红着的代码不许发版（issue #144）：全量质量门（静态 + 单元 + 集成），
      # 与 CI 三个 workflow 同一脚本——检查项单一事实源
      - name: Quality gate
        run: scripts/check_all.sh

      - name: Check tag version matches pyproject
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$tag" != "$pkg" ]; then
            echo "❌ tag ($tag) 与 pyproject 版本 ($pkg) 不一致" >&2
            exit 1
          fi
          echo "版本一致：$tag"

      - name: Build package
        run: bash scripts/build_package.sh

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # runner 预装 gh；--prerelease：当前版本线都是预发布（alpha）
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --prerelease
