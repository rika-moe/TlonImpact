name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check src/

      - name: Type check (mypy, full src/tlon, strict)
        run: uv run mypy src/tlon/

      - name: Import contracts (lint-imports)
        run: uv run lint-imports

      - name: Architecture check (DAG compliance)
        run: uv run python scripts/check_architecture.py --ci

      - name: No re-export check
        run: uv run python scripts/check_no_reexport.py --ci

      - name: Generated docs freshness
        run: uv run python scripts/gen_reference_docs.py --check

      - name: Run unit tests
        run: uv run pytest src/tests/ --ignore=src/tests/integration -v --tb=short
