repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: quality-gate-static
        name: Static quality gate (scripts/check_all.sh --static)
        entry: scripts/check_all.sh --static
        language: system
        pass_filenames: false

