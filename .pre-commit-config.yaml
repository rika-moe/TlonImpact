repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-no-reexport
        name: Check no re-export in __init__.py
        entry: python3 scripts/check_no_reexport.py --ci
        language: system
        files: ^src/.*__init__\.py$
        pass_filenames: false
      - id: mypy
        name: mypy (src/tlon, ratchet baseline in pyproject.toml)
        entry: uv run mypy src/tlon/
        language: system
        pass_filenames: false

